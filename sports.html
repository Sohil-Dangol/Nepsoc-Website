<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sports</title>
  <link rel="stylesheet" href="navbar.css">
  <link rel="stylesheet" href="footer.css">
  <link rel="stylesheet" href="sports.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="navbar"></div>

    <section class="hero">

        <p class="subtitle">HOME TO THE TOUGHEST TEAM IN WARWICK</p>

        <h1>SPORTS</h1>
        <div class="sports-grid">

                <div class="sport football">

                    <img src="football.jpeg" alt="Football">

                    <div class="overlay"></div>

                    <div class="label">
                        <span class="icon">⚽</span>
                        <h2>FOOTBALL</h2>
                    </div>

                </div>

                <div class="sport badminton">

                    <img src="badminton.jpg" alt="Badminton">

                    <div class="overlay"></div>

                    <div class="label">
                        <span class="icon">🏸</span>
                        <h2>BADMINTON</h2>
                    </div>

                </div>

                <div class="sport basketball">

                    <img src="basketball.jpg" alt="Basketball">

                    <div class="overlay"></div>

                    <div class="label">
                        <span class="icon">🏀</span>
                        <h2>BASKETBALL</h2>
                    </div>

                </div>

                <div class="sport volleyball">

                    <img src="volleyball.jpg" alt="Volleyball">

                    <div class="overlay"></div>

                    <div class="label">
                        <span class="icon">🏐</span>
                        <h2>VOLLEYBALL</h2>
                    </div>

                </div>

                <!-- Main Text -->

                <div class="hero-text">

                    <h3>NEPALESE</h3>
                    <h3>KNIGHTS</h3>

                </div>

                <!-- Athlete -->

                <img src="#" alt="Athlete" class="player">

        </div>
    </section>

  <div id="footer"></div>
  <script src="loadComponents.js"></script>
</body>
</html>
